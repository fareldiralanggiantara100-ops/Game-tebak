<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧩 Tebak-Tebakan Cewe</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(180deg,#ffe0f0,#fff5f9);font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px 12px 20px}
.top{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.logo{font-weight:900;font-size:22px;color:#e91e7a}
.logo span{font-size:12px;color:#999;font-weight:600;display:block}
.pill{background:#fff;padding:6px 12px;border-radius:20px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.08);font-size:14px}
.card{width:100%;max-width:420px;background:#fff;border-radius:22px;padding:18px;box-shadow:0 10px 30px rgba(233,30,122,.15);text-align:center}
.badge{display:inline-block;background:#ffe3f0;color:#e91e7a;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:800;margin-bottom:10px}
.qcat{font-size:12px;color:#999;letter-spacing:1px;font-weight:700}
.qemoji{font-size:58px;margin:12px 0;line-height:1}
.qtext{font-size:20px;font-weight:800;color:#333;line-height:1.4;margin-bottom:6px}
.qhint{font-size:13px;color:#999;margin-bottom:14px}
.timerWrap{height:8px;background:#eee;border-radius:10px;overflow:hidden;margin:10px 0 14px}
#timerBar{height:100%;background:linear-gradient(90deg,#ff4081,#ff9ec6);width:100%}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:#fff5f9;border:2px solid #ffe0f0;padding:14px;border-radius:16px;font-size:16px;font-weight:700;text-align:left;cursor:pointer}
.opt.correct{background:#d4edda!important;border-color:#28a745!important}
.opt.wrong{background:#f8d7da!important;border-color:#dc3545!important}
.stats{display:flex;gap:8px;margin-top:14px}
.stat{flex:1;background:#fff5f9;padding:10px;border-radius:14px}
.stat b{font-size:20px;color:#e91e7a;display:block}
.stat span{font-size:11px;color:#999}
.btn{background:#e91e7a;color:#fff;border:none;padding:15px 32px;border-radius:30px;font-size:17px;font-weight:800;width:100%;margin-top:12px}
.btn2{background:#fff;color:#e91e7a;border:2px solid #e91e7a}
.modeBtns{display:flex;gap:8px;margin-bottom:12px}
.modeBtn{flex:1;padding:10px;border-radius:14px;border:2px solid #ffe0f0;background:#fff;font-weight:800;font-size:13px;color:#666}
.modeBtn.active{background:#e91e7a;color:#fff;border-color:#e91e7a}
.streak{font-size:13px;color:#ff6b00;font-weight:800;margin-top:8px}
.progress{font-size:12px;color:#999;margin-bottom:8px}
</style>
</head>
<body>
<div class="top">
<div class="logo">🧩 TEBAK-TEBAKAN<span>Game Otak Buat Cewe</span></div>
<div class="pill">⭐ <span id="scoreTop">0</span></div>
</div>
<div class="card" id="startCard">
<div style="font-size:64px">🧠💖</div>
<h2 style="font-size:24px;color:#e91e7a;margin:8px 0">Tebak-Tebakan Cewe</h2>
<p style="color:#666;font-size:14px;line-height:1.6;margin-bottom:14px">Ada 3 mode seru:<br>🎬 <b>Tebak Emoji</b><br>💬 <b>Tebak Kata</b><br>💘 <b>Kuis Bucin</b></p>
<div class="modeBtns">
<button class="modeBtn active" onclick="setMode('emoji',this)">🎬 Emoji</button>
<button class="modeBtn" onclick="setMode('kata',this)">💬 Kata</button>
<button class="modeBtn" onclick="setMode('bucin',this)">💘 Bucin</button>
</div>
<button class="btn" onclick="startGame()">▶️ MULAI MAIN</button>
<div class="stats">
<div class="stat"><b id="bestScore">0</b><span>🏆 TERBAIK</span></div>
<div class="stat"><b id="totalPlayed">0</b><span>🎮 MAIN</span></div>
<div class="stat"><b id="accuracy">-</b><span>🎯 AKURASI</span></div>
</div>
</div>
<div class="card" id="gameCard" style="display:none">
<div class="progress" id="progress">Soal 1 dari 10</div>
<div class="badge" id="badge">🎬 TEBAK EMOJI</div>
<div class="timerWrap"><div id="timerBar"></div></div>
<div class="qcat" id="qcat">FILM</div>
<div class="qemoji" id="qemoji">🍔👑</div>
<div class="qtext" id="qtext">Apa ini?</div>
<div class="qhint" id="qhint">Petunjuk: ...</div>
<div class="opts" id="opts"></div>
<div class="streak" id="streak">🔥 Streak: 0</div>
<div class="stats">
<div class="stat"><b id="score">0</b><span>SKOR</span></div>
<div class="stat"><b id="correct">0</b><span>BENER</span></div>
<div class="stat"><b id="wrong">0</b><span>SALAH</span></div>
</div>
</div>
<div class="card" id="endCard" style="display:none">
<div id="endEmoji" style="font-size:64px">🏆</div>
<h2 id="endTitle" style="font-size:24px;color:#e91e7a;margin:8px 0">Keren Banget!</h2>
<p id="endDesc" style="color:#666;font-size:14px;line-height:1.6"></p>
<div class="stats">
<div class="stat"><b id="finalScore">0</b><span>SKOR AKHIR</span></div>
<div class="stat"><b id="finalCorrect">0</b><span>BENER</span></div>
<div class="stat"><b id="finalAcc">0%</b><span>AKURASI</span></div>
</div>
<button class="btn" onclick="startGame()">🔁 MAIN LAGI</button>
<button class="btn btn2" onclick="backHome()">🏠 GANTI MODE</button>
</div>
<script>
let mode='emoji',currentMode='emoji',questions=[],idx=0,score=0,correct=0,wrong=0,streak=0,timer=null,timeLeft=15;
let data={
emoji:[
{q:'🍔👑',a:'Burger King',cat:'MAKANAN',hint:'Tempat makan burger, rajanya...',opts:['Burger King','McD','KFC','Pizza Hut']},
{q:'🧋🐻',a:'Kuma Boba',cat:'MINUMAN',hint:'Boba + beruang',opts:['Kuma Boba','Chatime','Xing Fu Tang','Gong Cha']},
{q:'🐻🍯',a:'Winnie The Pooh',cat:'FILM',hint:'Beruang suka madu',opts:['Winnie The Pooh','Paddington','Ted','Kung Fu Panda']},
{q:'🍕🍝🇮🇹',a:'Italia',cat:'NEGARA',hint:'Negara pizza & pasta',opts:['Italia','Perancis','Spanyol','Yunani']},
{q:'🎤💜💣',a:'BTS',cat:'K-POP',hint:'Boyband ungu, ARMY',opts:['BTS','Blackpink','EXO','Seventeen']},
{q:'💄👠👗',a:'Dandan',cat:'KEGIATAN',hint:'Cewe sebelum kondangan',opts:['Dandan','Tidur','Makan','Nangis']},
{q:'🐱🎀',a:'Hello Kitty',cat:'KARAKTER',hint:'Kucing pita merah',opts:['Hello Kitty','Kuromi','My Melody','Cinnamoroll']},
{q:'🌙⭐🌃',a:'Malam',cat:'KATA',hint:'Lawannya siang',opts:['Malam','Senja','Pagi','Sore']},
],
kata:[
{q:'Bahasa gaul buat "cantik banget"',a:'Slay',cat:'BAHASA GAUL',hint:'S-L-A-Y',opts:['Slay','Spill','Salty','Sadge']},
{q:'Makanan pedas dari Bandung, pake kerupuk',a:'Seblak',cat:'MAKANAN',hint:'S-E-B-L-A-K',opts:['Seblak','Cilok','Batagor','Siomay']},
{q:'Kalo cewe bilang "terserah" artinya?',a:'Harus peka',cat:'KODE CEWE',hint:'Bukan beneran terserah!',opts:['Harus peka','Bodo amat','Lagi kenyang','Mau tidur']},
{q:'Skincare biar ga gosong',a:'Sunscreen',cat:'SKINCARE',hint:'Dipake pagi-pagi',opts:['Sunscreen','Serum','Toner','Moisturizer']},
{q:'Grup K-Pop 4 orang, ada Jennie',a:'Blackpink',cat:'K-POP',hint:'Pink venom',opts:['Blackpink','Twice','Red Velvet','AESPA']},
{q:'Hewan paling gemes, meong...',a:'Kucing',cat:'HEWAN',hint:'Meong',opts:['Kucing','Ular','Kecoa','Tikus']},
],
bucin:[
{q:'Kalo dia online tapi ga bales chat, kamu?',a:'Overthinking',cat:'KUIS BUCIN',hint:'Jujur aja...',opts:['Overthinking','Santai aja','Langsung telpon','Blokir']},
{q:'Kalo kangen, biasanya kamu?',a:'Stalking IG-nya',cat:'KUIS BUCIN',hint:'Hayoo ngaku',opts:['Stalking IG-nya','Tidur','Makan','Nonton drakor']},
{q:'Kalo dia bilang "kita temenan aja", kamu?',a:'Nangis di kamar',cat:'KUIS BUCIN',hint:'Sakit tapi ga berdarah',opts:['Nangis di kamar','Langsung move on','Cari yang baru','Ketawa aja']},
{q:'Chat paling bikin deg-degan?',a:'"Kamu lagi apa?" dari dia',cat:'KUIS BUCIN',hint:'Dari doi...',opts:['"Kamu lagi apa?" dari dia','"Pinjem duit dong"','"Besok ulangan"','"Mama manggil"']},
]
};
function setMode(m,btn){mode=m;document.querySelectorAll('.modeBtn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
function shuffle(a){return a.sort(()=>Math.random()-0.5);}
function startGame(){currentMode=mode;questions=shuffle([...data[currentMode]]).slice(0,10);idx=0;score=0;correct=0;wrong=0;streak=0;document.getElementById('startCard').style.display='none';document.getElementById('endCard').style.display='none';document.getElementById('gameCard').style.display='block';showQ();}
function showQ(){let q=questions[idx];document.getElementById('progress').textContent='Soal '+(idx+1)+' dari '+questions.length;document.getElementById('badge').textContent=currentMode=='emoji'?'🎬 TEBAK EMOJI':currentMode=='kata'?'💬 TEBAK KATA':'💘 KUIS BUCIN';document.getElementById('qcat').textContent=q.cat;document.getElementById('qemoji').textContent=q.q;document.getElementById('qhint').textContent='Petunjuk: '+q.hint;document.getElementById('score').textContent=score;document.getElementById('correct').textContent=correct;document.getElementById('wrong').textContent=wrong;document.getElementById('streak').textContent='🔥 Streak: '+streak;document.getElementById('scoreTop').textContent=score;let optsDiv=document.getElementById('opts');optsDiv.innerHTML='';shuffle([...q.opts]).forEach(opt=>{let b=document.createElement('button');b.className='opt';b.textContent=opt;b.onclick=()=>check(b,opt,q.a);optsDiv.appendChild(b);});startTimer();}
function startTimer(){clearInterval(timer);timeLeft=15;document.getElementById('timerBar').style.width='100%';timer=setInterval(()=>{timeLeft-=0.1;document.getElementById('timerBar').style.width=(timeLeft/15*100)+'%';if(timeLeft<=0){clearInterval(timer);timeoutAns();}},100);}
function timeoutAns(){wrong++;streak=0;document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.textContent==questions[idx].a)b.classList.add('correct');});setTimeout(next,1200);}
function check(btn,chosen,right){clearInterval(timer);document.querySelectorAll('.opt').forEach(b=>b.disabled=true);if(chosen==right){btn.classList.add('correct');correct++;streak++;score+=100+Math.ceil(timeLeft)+(streak>=3?50:0);}else{btn.classList.add('wrong');wrong++;streak=0;document.querySelectorAll('.opt').forEach(b=>{if(b.textContent==right)b.classList.add('correct');});}document.getElementById('score').textContent=score;document.getElementById('scoreTop').textContent=score;setTimeout(next,1000);}
function next(){idx++;if(idx>=questions.length)endGame();else showQ();}
function endGame(){document.getElementById('gameCard').style.display='none';document.getElementById('endCard').style.display='block';let acc=Math.round(correct/(correct+wrong)*100)||0;document.getElementById('finalScore').textContent=score;document.getElementById('finalCorrect').textContent=correct+' / '+questions.length;document.getElementById('finalAcc').textContent=acc+'%';let title='RATU TEBAKAN! 👑',desc='Otak kamu encer banget! Pinter + cantik, paket lengkap! ✨';if(currentMode=='bucin'){if(score>=500){title='BUCIN PARAH! 💘';desc='Kamu bucin level akut! Udah, tembak aja dia sekarang! 😭💖';}else if(score>=300){title='Bucin Tipis-Tipis';desc='Masih bisa diselamatkan, tapi dikit lagi bucin akut nih 😜';}else{title='Sok Cool! 😎';desc='Kamu sok jual mahal ya? Padahal dalem hati kangen berat kan?';}}else{if(acc<50){title='Yahh, Coba Lagi! 🥺';desc='Gapapa, yang penting cantik! Main lagi yuk!';}else if(acc<80){title='Lumayan Pinter! 🌸';desc='Dikit lagi jadi Ratu Tebakan! Main lagi yuk!';}}document.getElementById('endTitle').textContent=title;document.getElementById('endDesc').textContent=desc;document.getElementById('endEmoji').textContent='🏆';let best=parseInt(localStorage.getItem('tebak_best')||0);if(score>best){localStorage.setItem('tebak_best',score);best=score;}document.getElementById('bestScore').textContent=best;let played=parseInt(localStorage.getItem('tebak_played')||0)+1;localStorage.setItem('tebak_played',played);document.getElementById('totalPlayed').textContent=played;document.getElementById('accuracy').textContent=acc+'%';}
function backHome(){document.getElementById('endCard').style.display='none';document.getElementById('startCard').style.display='block';}
document.getElementById('bestScore').textContent=localStorage.getItem('tebak_best')||0;
document.getElementById('totalPlayed').textContent=localStorage.getItem('tebak_played')||0;
</script>
</body>
  </html>
